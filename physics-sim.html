<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>2D 물리 시뮬레이션</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:rgba(20,26,44,.82); --line:rgba(255,255,255,.09);
    --text:#e7ecf8; --dim:#8b96b3; --accent:#7c9cff; --accent2:#ff7ca8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:13px/1.4 system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  #bar{background:var(--panel);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:8px 12px;display:flex;flex-direction:column;gap:8px;z-index:2}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
  .top{justify-content:space-between}
  h1{font-size:15px;margin:0;letter-spacing:.2px;font-weight:700;display:flex;align-items:center;gap:8px}
  h1 i{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-block}
  #hint{color:var(--dim);font-weight:400;font-size:12px}
  #stats{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px}
  .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  button{font:inherit;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
  button:hover{background:rgba(255,255,255,.12)}
  button:active{transform:scale(.96)}
  button.on{background:rgba(124,156,255,.22);border-color:var(--accent);color:#fff}
  label.sl{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
  label.sl b{color:var(--text);font-weight:600;min-width:38px;font-variant-numeric:tabular-nums}
  input[type=range]{width:96px;accent-color:var(--accent);height:18px}
  #stage{flex:1;min-height:0;position:relative;overflow:hidden}
  canvas{position:absolute;left:0;top:0;touch-action:none;cursor:default;display:block}
  @media (max-width:640px){
    #bar{padding:6px 8px;gap:6px}
    button{padding:6px 8px;font-size:12px}
    input[type=range]{width:74px}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="row top">
      <h1><i></i>Physics Playground <span id="hint">물체를 잡아 끌고, 빠르게 휘둘러 놓아 던져보세요</span></h1>
      <div id="stats">—</div>
    </div>
    <div class="row">
      <div class="grp">
        <button data-act="circle">● 원</button>
        <button data-act="box">■ 사각형</button>
        <button data-act="burst">랜덤 ×10</button>
        <button data-act="explode">폭발</button>
        <button data-act="shake">흔들기</button>
      </div>
      <div class="grp">
        <button data-act="pause" id="bPause">일시정지</button>
        <button data-act="clear">비우기</button>
        <button data-act="reset">초기화</button>
        <button data-act="obst" id="bObst" class="on">장애물</button>
        <button data-act="debug" id="bDebug">디버그</button>
      </div>
      <div class="grp">
        <label class="sl">중력 <input id="sG" type="range" min="0" max="25" step="0.1" value="9.8"><b id="vG">9.8</b></label>
        <label class="sl">탄성 <input id="sB" type="range" min="0" max="1.4" step="0.05" value="1"><b id="vB">100%</b></label>
        <label class="sl">마찰 <input id="sF" type="range" min="0" max="2" step="0.05" value="1"><b id="vF">100%</b></label>
      </div>
    </div>
  </header>
  <div id="stage"><canvas id="c"></canvas></div>
</div>

<script>
(() => {
'use strict';

/* ============================================================
 *  2D Rigid-body physics — 라이브러리 없이 직접 구현
 *  - 원 / 회전하는 사각형 (OBB)
 *  - 충돌 감지: 원-원, 원-박스, 박스-박스(SAT + 클리핑 접촉 매니폴드)
 *  - 충돌 해결: 순차 임펄스(Sequential Impulse) + Warm Starting
 *  - 반발(restitution), 쿨롱 마찰, 회전(각속도/관성 모멘트)
 *  - 안정화: 서브스텝, 투기적 접촉, slop, 바이어스 상한, 슬리핑
 * ============================================================ */

// ---------- 상수 ----------
const FIXED   = 1/60;   // 프레임당 고정 시간 간격
const SUB     = 4;      // 서브스텝 수 (h = 1/240 s)
const ITER    = 10;     // 서브스텝당 속도 반복 횟수
const SLOP    = 0.008;  // 허용 침투(m)
const MARGIN  = 0.02;   // 투기적 접촉 거리(m)
const BETA    = 0.2;    // 위치 보정 비율
const MAXBIAS = 2.5;    // 위치 보정 최대 속도(m/s)
const REST_THR= 1.2;    // 이 속도 이상으로 충돌해야 반발 적용(m/s)
const MAXV    = 50;     // 최대 속도(m/s)
const SLEEP_T = 0.6;    // 수면 진입 시간(s)
const MAXB    = 360;    // 최대 물체 수
const DRAG_F  = 7, DRAG_Z = 0.85, DRAG_MAXF = 700; // 마우스 조인트

const G = { g: 9.8, bounce: 1, fric: 1, paused: false, debug: false, obstacles: true };

// ---------- 캔버스 / 좌표계 (월드: 미터, y 아래로) ----------
const stage = document.getElementById('stage');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, PPM = 0, WW = 0, WH = 0, FL = 22;
let bg = null;

// ---------- 재질 ----------
const MATS = [
  { name:'고무', d:0.7, e:0.78, mu:0.90, hue:348, sat:82, l:60 },
  { name:'나무', d:1.0, e:0.35, mu:0.55, hue:32,  sat:68, l:54 },
  { name:'금속', d:2.6, e:0.18, mu:0.35, hue:212, sat:16, l:62 },
  { name:'유리', d:1.6, e:0.45, mu:0.12, hue:172, sat:72, l:52 },
];
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- 물체 ----------
let nextId = 1;
const bodies = [];   // 동적 물체
const sorted = [];   // 브로드페이즈용 정렬 배열
const statics = [];  // 정적 물체(벽, 장애물)

function makeBody(o) {
  const b = {
    id: nextId++, type: o.type, x: o.x, y: o.y, a: o.a || 0,
    vx: 0, vy: 0, w: 0,
    r: o.r || 0, hw: o.hw || 0, hh: o.hh || 0,
    e: o.e, mu: o.mu, isStatic: !!o.isStatic,
    sleeping: false, sleepT: 0, touching: false,
    c: 1, s: 0, v: new Float64Array(8), n: new Float64Array(8),
    ax0: 0, ax1: 0, ay0: 0, ay1: 0,
    px: o.x, py: o.y, pa: o.a || 0,
    hue: o.hue || 210, sat: o.sat || 10, l: o.l || 50,
    mass: 0, invM: 0, invI: 0, par: null, mn: 0
  };
  const area = b.type === 'circle' ? Math.PI * b.r * b.r : 4 * b.hw * b.hh;
  if (!b.isStatic) {
    b.mass = o.density * area;
    const I = b.type === 'circle' ? 0.5 * b.mass * b.r * b.r
                                  : b.mass * (b.hw * b.hw + b.hh * b.hh) / 3;
    b.invM = 1 / b.mass; b.invI = 1 / I;
  }
  b.c1 = `hsl(${b.hue} ${b.sat}% ${Math.min(b.l + 14, 88)}%)`;
  b.c2 = `hsl(${b.hue} ${b.sat}% ${Math.max(b.l - 12, 12)}%)`;
  b.cs = `hsl(${b.hue} ${b.sat}% ${Math.max(b.l - 26, 8)}%)`;
  prep(b);
  return b;
}

function radiusOf(b) { return b.type === 'circle' ? b.r : Math.hypot(b.hw, b.hh); }

function spawn(type, x, y, mat) {
  if (bodies.length >= MAXB) return null;
  const m = mat || MATS[(Math.random() * MATS.length) | 0];
  const o = { type, x, y, a: Math.random() * Math.PI * 2, e: m.e, mu: m.mu, density: m.d,
              hue: m.hue + rnd(-7, 7), sat: m.sat, l: m.l + rnd(-5, 5) };
  if (type === 'circle') o.r = Math.random() < .25 ? rnd(0.5, 0.8) : rnd(0.2, 0.5);
  else if (Math.random() < 0.16) { o.hw = rnd(0.7, 1.15); o.hh = rnd(0.1, 0.17); }   // 긴 판자
  else { o.hw = rnd(0.2, 0.62); o.hh = rnd(0.2, 0.62); }
  const b = makeBody(o);
  bodies.push(b); sorted.push(b);
  return b;
}

function findFreeSpot(rad, tries = 40) {
  for (let t = 0; t < tries; t++) {
    const x = rnd(rad + 0.1, WW - rad - 0.1), y = rnd(rad + 0.1, WH * 0.55);
    let ok = true;
    for (const b of bodies) {
      const dx = b.x - x, dy = b.y - y, rr = radiusOf(b) + rad + 0.05;
      if (dx * dx + dy * dy < rr * rr) { ok = false; break; }
    }
    if (ok) return { x, y };
  }
  return { x: rnd(rad, WW - rad), y: rnd(-3, 0.5) };
}

function spawnRandom(n) {
  for (let i = 0; i < n; i++) {
    const type = Math.random() < 0.5 ? 'circle' : 'box';
    const b = spawn(type, 0, 0);
    if (!b) return;
    const p = findFreeSpot(radiusOf(b));
    b.x = b.px = p.x; b.y = b.py = p.y;
    prep(b);
  }
}

function spawnAt(type, x, y) {
  const b = spawn(type, x, y);
  if (b) { b.vy = 1; b.vx = rnd(-1.5, 1.5); b.w = rnd(-3, 3); }
}

// ---------- 정적 물체 ----------
function buildStatics() {
  statics.length = 0;
  const add = (o) => {
    const b = makeBody(Object.assign({ isStatic: true, e: 0.3, mu: 0.6, density: 1 }, o));
    statics.push(b); return b;
  };
  const T = 6;
  add({ type:'box', x: WW/2, y: WH + T, hw: WW/2 + T*2, hh: T, wall: true });    // 바닥
  add({ type:'box', x: WW/2, y: -T,     hw: WW/2 + T*2, hh: T, wall: true });    // 천장
  add({ type:'box', x: -T,     y: WH/2, hw: T, hh: WH/2 + T*2, wall: true });    // 왼벽
  add({ type:'box', x: WW + T, y: WH/2, hw: T, hh: WH/2 + T*2, wall: true });    // 오른벽
  if (G.obstacles) {
    add({ type:'box', x: WW*0.25, y: WH*0.60, hw: Math.max(1.0, WW*0.14), hh: 0.17, a: 0.30, hue:220, sat:20, l:40 });
    add({ type:'box', x: WW*0.75, y: WH*0.42, hw: Math.max(1.0, WW*0.14), hh: 0.17, a: -0.30, hue:220, sat:20, l:40 });
    add({ type:'circle', x: WW*0.5, y: WH*0.74, r: Math.min(0.6, WW*0.05), hue:220, sat:20, l:40 });
  }
}

// ---------- 형상 갱신 ----------
function prep(b) {
  b.c = Math.cos(b.a); b.s = Math.sin(b.a);
  if (b.type === 'circle') {
    b.ax0 = b.x - b.r - MARGIN; b.ax1 = b.x + b.r + MARGIN;
    b.ay0 = b.y - b.r - MARGIN; b.ay1 = b.y + b.r + MARGIN;
  } else {
    const c = b.c, s = b.s, hw = b.hw, hh = b.hh, v = b.v, n = b.n;
    v[0] = b.x - hw*c + hh*s; v[1] = b.y - hw*s - hh*c;
    v[2] = b.x + hw*c + hh*s; v[3] = b.y + hw*s - hh*c;
    v[4] = b.x + hw*c - hh*s; v[5] = b.y + hw*s + hh*c;
    v[6] = b.x - hw*c - hh*s; v[7] = b.y - hw*s + hh*c;
    n[0] = s;  n[1] = -c;  n[2] = c;  n[3] = s;
    n[4] = -s; n[5] = c;   n[6] = -c; n[7] = -s;
    const ex = Math.abs(c)*hw + Math.abs(s)*hh, ey = Math.abs(s)*hw + Math.abs(c)*hh;
    b.ax0 = b.x - ex - MARGIN; b.ax1 = b.x + ex + MARGIN;
    b.ay0 = b.y - ey - MARGIN; b.ay1 = b.y + ey + MARGIN;
  }
}

// ============================================================
//  충돌 감지 (Narrow phase)  — manifold: {a,b,nx,ny,pts:[{x,y,pen,id}]}
//  법선 n 은 a → b 방향
// ============================================================
function collideCC(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
  const d2 = dx*dx + dy*dy, lim = rr + MARGIN;
  if (d2 > lim*lim) return null;
  const d = Math.sqrt(d2);
  const nx = d > 1e-9 ? dx/d : 0, ny = d > 1e-9 ? dy/d : 1;
  const pen = rr - d;
  return { a, b, nx, ny, pts: [{ x: a.x + nx*(a.r - pen/2), y: a.y + ny*(a.r - pen/2), pen, id: 0 }] };
}

// A = 박스, C = 원
function collideBC(A, C) {
  const dx = C.x - A.x, dy = C.y - A.y;
  const lx = dx*A.c + dy*A.s, ly = -dx*A.s + dy*A.c;
  const qx = clamp(lx, -A.hw, A.hw), qy = clamp(ly, -A.hh, A.hh);
  const ex = lx - qx, ey = ly - qy, d2 = ex*ex + ey*ey;
  let nlx, nly, pen, sx, sy;
  if (d2 > 1e-12) {
    const d = Math.sqrt(d2);
    if (d > C.r + MARGIN) return null;
    nlx = ex/d; nly = ey/d; pen = C.r - d; sx = qx; sy = qy;
  } else { // 중심이 박스 내부
    const ddx = A.hw - Math.abs(lx), ddy = A.hh - Math.abs(ly);
    if (ddx < ddy) { const sg = lx < 0 ? -1 : 1; nlx = sg; nly = 0; sx = sg*A.hw; sy = ly; pen = C.r + ddx; }
    else { const sg = ly < 0 ? -1 : 1; nlx = 0; nly = sg; sx = lx; sy = sg*A.hh; pen = C.r + ddy; }
  }
  const nx = nlx*A.c - nly*A.s, ny = nlx*A.s + nly*A.c;
  const spx = A.x + sx*A.c - sy*A.s, spy = A.y + sx*A.s + sy*A.c;
  const cpx = C.x - nx*C.r, cpy = C.y - ny*C.r;
  return { a: A, b: C, nx, ny, pts: [{ x: (spx + cpx)/2, y: (spy + cpy)/2, pen, id: 0 }] };
}

let _idx = 0;
function maxSep(P, Q) {
  let best = -1e9, bi = 0;
  const pv = P.v, pn = P.n, qv = Q.v;
  for (let i = 0; i < 4; i++) {
    const nx = pn[2*i], ny = pn[2*i+1], px = pv[2*i], py = pv[2*i+1];
    let m = 1e9;
    for (let j = 0; j < 4; j++) {
      const d = (qv[2*j] - px)*nx + (qv[2*j+1] - py)*ny;
      if (d < m) m = d;
    }
    if (m > best) { best = m; bi = i; }
  }
  _idx = bi;
  return best;
}

function clipSeg(p0, p1, nx, ny, c) {
  const d0 = p0.x*nx + p0.y*ny - c, d1 = p1.x*nx + p1.y*ny - c;
  const out = [];
  if (d0 >= 0) out.push(p0);
  if (d1 >= 0) out.push(p1);
  if (d0 * d1 < 0) {
    const t = d0 / (d0 - d1);
    out.push({ x: p0.x + t*(p1.x - p0.x), y: p0.y + t*(p1.y - p0.y), k: d0 < 0 ? p0.k : p1.k });
  }
  return out;
}

function collideBB(A, B) {
  const sA = maxSep(A, B); const iA = _idx; if (sA > MARGIN) return null;
  const sB = maxSep(B, A); const iB = _idx; if (sB > MARGIN) return null;
  let R, I, ri, refIsB;
  if (sB > sA + 0.002) { R = B; I = A; ri = iB; refIsB = 1; }   // 기준면: 분리축이 더 좋은 쪽 (약간 A 선호)
  else                 { R = A; I = B; ri = iA; refIsB = 0; }
  const nx = R.n[2*ri], ny = R.n[2*ri+1];
  // 입사 변: 기준 법선과 가장 반대를 향하는 변
  let ii = 0, md = 1e9;
  for (let j = 0; j < 4; j++) {
    const d = I.n[2*j]*nx + I.n[2*j+1]*ny;
    if (d < md) { md = d; ii = j; }
  }
  const j2 = (ii + 1) & 3;
  const p0 = { x: I.v[2*ii], y: I.v[2*ii+1], k: 0 }, p1 = { x: I.v[2*j2], y: I.v[2*j2+1], k: 1 };
  const rj = (ri + 1) & 3;
  const r1x = R.v[2*ri], r1y = R.v[2*ri+1], r2x = R.v[2*rj], r2y = R.v[2*rj+1];
  let tx = r2x - r1x, ty = r2y - r1y; const tl = Math.hypot(tx, ty); tx /= tl; ty /= tl;
  let pts = clipSeg(p0, p1, tx, ty, tx*r1x + ty*r1y);       if (pts.length < 2) return null;
  pts = clipSeg(pts[0], pts[1], -tx, -ty, -(tx*r2x + ty*r2y)); if (pts.length < 2) return null;
  const out = [];
  for (const p of pts) {
    const sep = (p.x - r1x)*nx + (p.y - r1y)*ny;
    if (sep <= MARGIN) out.push({ x: p.x - nx*sep*0.5, y: p.y - ny*sep*0.5, pen: -sep,
                                  id: p.k | (ii << 1) | (ri << 3) | (refIsB << 5) });
  }
  if (!out.length) return null;
  const sg = refIsB ? -1 : 1;
  return { a: A, b: B, nx: nx*sg, ny: ny*sg, pts: out };
}

// ============================================================
//  접촉 관리 / 브로드페이즈
// ============================================================
let contacts = [];
let cmap = new Map();

function wake(b) { if (b.sleeping) { b.sleeping = false; } b.sleepT = 0; }

function pair(a, b) {
  let m;
  if (a.type === 'circle') m = b.type === 'circle' ? (a.id < b.id ? collideCC(a, b) : collideCC(b, a)) : collideBC(b, a);
  else                     m = b.type === 'circle' ? collideBC(a, b) : (a.id < b.id ? collideBB(a, b) : collideBB(b, a));
  if (!m) return;
  if (a.sleeping) wake(a);
  if (b.sleeping) wake(b);
  const A = m.a, B = m.b;
  A.touching = B.touching = true;
  const key = Math.min(A.id, B.id) * 1e7 + Math.max(A.id, B.id);
  const prev = prevMap.get(key);
  for (const p of m.pts) {
    p.Pn = 0; p.Pt = 0; p.matched = false;
    if (prev) for (const q of prev.pts) if (q.id === p.id) { p.Pn = q.Pn; p.Pt = q.Pt; p.matched = true; break; }
  }
  contacts.push(m); cmap.set(key, m);
}

let prevMap = new Map();

function detect() {
  prevMap = cmap; cmap = new Map(); contacts.length = 0;
  for (const b of bodies) { b.touching = false; prep(b); }
  // 삽입 정렬 (프레임 간 거의 정렬 상태 유지)
  for (let i = 1; i < sorted.length; i++) {
    const x = sorted[i]; let j = i - 1;
    while (j >= 0 && sorted[j].ax0 > x.ax0) { sorted[j+1] = sorted[j]; j--; }
    sorted[j+1] = x;
  }
  const n = sorted.length;
  for (let i = 0; i < n; i++) {
    const a = sorted[i];
    for (let j = i + 1; j < n; j++) {
      const b = sorted[j];
      if (b.ax0 > a.ax1) break;
      if (a.sleeping && b.sleeping) continue;
      if (b.ay0 > a.ay1 || b.ay1 < a.ay0) continue;
      pair(a, b);
    }
  }
  for (const a of bodies) {
    if (a.sleeping) continue;
    for (const s of statics) {
      if (s.ax0 > a.ax1 || s.ax1 < a.ax0 || s.ay0 > a.ay1 || s.ay1 < a.ay0) continue;
      pair(a, s);
    }
  }
}

// ============================================================
//  솔버
// ============================================================
function applyImpulse(a, b, px, py, rax, ray, rbx, rby) {
  a.vx -= px * a.invM; a.vy -= py * a.invM; a.w -= a.invI * (rax*py - ray*px);
  b.vx += px * b.invM; b.vy += py * b.invM; b.w += b.invI * (rbx*py - rby*px);
}

function prepare(h) {
  for (const c of contacts) {
    const a = c.a, b = c.b, nx = c.nx, ny = c.ny, tx = ny, ty = -nx;
    c.e  = Math.min(1, Math.max(a.e, b.e) * G.bounce);
    c.mu = Math.sqrt(a.mu * b.mu) * G.fric;
    c.tx = tx; c.ty = ty;
    for (const p of c.pts) {
      p.rax = p.x - a.x; p.ray = p.y - a.y; p.rbx = p.x - b.x; p.rby = p.y - b.y;
      const rnA = p.rax*ny - p.ray*nx, rnB = p.rbx*ny - p.rby*nx;
      const rtA = p.rax*ty - p.ray*tx, rtB = p.rbx*ty - p.rby*tx;
      p.massN = 1 / (a.invM + b.invM + a.invI*rnA*rnA + b.invI*rnB*rnB);
      p.massT = 1 / (a.invM + b.invM + a.invI*rtA*rtA + b.invI*rtB*rtB);
      const dvx = (b.vx - b.w*p.rby) - (a.vx - a.w*p.ray);
      const dvy = (b.vy + b.w*p.rbx) - (a.vy + a.w*p.rax);
      const vn = dvx*nx + dvy*ny;
      p.bias = p.pen > SLOP ? Math.min(BETA*(p.pen - SLOP)/h, MAXBIAS) : (p.pen > 0 ? 0 : p.pen/h);
      p.rest = vn < -REST_THR ? -c.e * vn : 0;
      if (!p.matched && vn < -2.5) impactFX(p.x, p.y, nx, ny, -vn, a, b);
      // warm start
      applyImpulse(a, b, p.Pn*nx + p.Pt*tx, p.Pn*ny + p.Pt*ty, p.rax, p.ray, p.rbx, p.rby);
    }
  }
}

function solveContacts(rev) {
  const n = contacts.length;
  for (let k = 0; k < n; k++) {
    const c = contacts[rev ? n - 1 - k : k];
    const a = c.a, b = c.b, nx = c.nx, ny = c.ny, tx = c.tx, ty = c.ty;
    for (const p of c.pts) {            // 마찰
      const dvx = (b.vx - b.w*p.rby) - (a.vx - a.w*p.ray);
      const dvy = (b.vy + b.w*p.rbx) - (a.vy + a.w*p.rax);
      const vt = dvx*tx + dvy*ty;
      const maxF = c.mu * p.Pn;
      const np = clamp(p.Pt - vt*p.massT, -maxF, maxF);
      const d = np - p.Pt; p.Pt = np;
      applyImpulse(a, b, d*tx, d*ty, p.rax, p.ray, p.rbx, p.rby);
    }
    for (const p of c.pts) {            // 법선(반발 / 침투 복구 / 투기적 접촉)
      const dvx = (b.vx - b.w*p.rby) - (a.vx - a.w*p.ray);
      const dvy = (b.vy + b.w*p.rbx) - (a.vy + a.w*p.rax);
      const vn = dvx*nx + dvy*ny;
      const target = p.bias > p.rest ? p.bias : p.rest;
      const np = Math.max(p.Pn + p.massN*(target - vn), 0);
      const d = np - p.Pn; p.Pn = np;
      applyImpulse(a, b, d*nx, d*ny, p.rax, p.ray, p.rbx, p.rby);
    }
  }
}

// ---------- 마우스 조인트 (소프트 스프링 제약) ----------
let drag = null;
function prepJoint(h) {
  if (!drag) return;
  const b = drag.b;
  const rx = b.c*drag.lx - b.s*drag.ly, ry = b.s*drag.lx + b.c*drag.ly;
  const m = b.mass, om = 2*Math.PI*DRAG_F;
  const d = 2*m*DRAG_Z*om, k = m*om*om;
  const gamma = 1 / (h*(d + h*k)), beta = h*k*gamma;
  const kxx = b.invM + b.invI*ry*ry + gamma, kxy = -b.invI*rx*ry, kyy = b.invM + b.invI*rx*rx + gamma;
  const det = 1 / (kxx*kyy - kxy*kxy);
  Object.assign(drag, { rx, ry, gamma, beta, kxx, kxy, kyy, det, h,
    cx: b.x + rx - drag.tx, cy: b.y + ry - drag.ty });
  drag.ix *= 0.9; drag.iy *= 0.9;
  b.vx += b.invM*drag.ix; b.vy += b.invM*drag.iy; b.w += b.invI*(rx*drag.iy - ry*drag.ix);
}
function solveJoint() {
  if (!drag) return;
  const b = drag.b, d = drag;
  const cdx = b.vx - b.w*d.ry, cdy = b.vy + b.w*d.rx;
  const rx_ = -(cdx + d.beta*d.cx + d.gamma*d.ix), ry_ = -(cdy + d.beta*d.cy + d.gamma*d.iy);
  let px = d.det*(d.kyy*rx_ - d.kxy*ry_), py = d.det*(-d.kxy*rx_ + d.kxx*ry_);
  const ox = d.ix, oy = d.iy;
  d.ix += px; d.iy += py;
  const maxI = b.mass * DRAG_MAXF * d.h, l = Math.hypot(d.ix, d.iy);
  if (l > maxI) { d.ix *= maxI/l; d.iy *= maxI/l; }
  px = d.ix - ox; py = d.iy - oy;
  b.vx += b.invM*px; b.vy += b.invM*py; b.w += b.invI*(d.rx*py - d.ry*px);
}

// ============================================================
//  시뮬레이션 스텝
// ============================================================
function substep(h) {
  const ld = 1 / (1 + h*0.05);
  for (const b of bodies) {
    if (b.sleeping) continue;
    b.vy += G.g * h;
    b.vx *= ld; b.vy *= ld;
    let ad = b.touching && b.type === 'circle' ? 0.6 : 0.1;
    if (drag && drag.b === b) ad += 6;
    b.w /= (1 + h*ad);
  }
  detect();
  prepare(h);
  prepJoint(h);
  for (let it = 0; it < ITER; it++) { solveContacts(it & 1); solveJoint(); }
  for (const b of bodies) {
    if (b.sleeping) continue;
    const s2 = b.vx*b.vx + b.vy*b.vy;
    if (s2 > MAXV*MAXV) { const k = MAXV/Math.sqrt(s2); b.vx *= k; b.vy *= k; }
    if (b.w > 40) b.w = 40; else if (b.w < -40) b.w = -40;
    b.x += b.vx*h; b.y += b.vy*h; b.a += b.w*h;
  }
}

function find(x) { while (x.par !== x) { x.par = x.par.par; x = x.par; } return x; }

function updateSleep(dt) {
  for (const b of bodies) {
    if (b.sleeping) continue;
    b.par = b; b.mn = Infinity;
    const slow = b.vx*b.vx + b.vy*b.vy < 0.02 && b.w*b.w < 0.06;
    b.sleepT = slow ? b.sleepT + dt : 0;
    if (drag && drag.b === b) b.sleepT = 0;
  }
  for (const c of contacts) {
    if (c.a.isStatic || c.b.isStatic) continue;
    const ra = find(c.a), rb = find(c.b); if (ra !== rb) ra.par = rb;
  }
  for (const b of bodies) if (!b.sleeping) { const r = find(b); if (b.sleepT < r.mn) r.mn = b.sleepT; }
  for (const b of bodies) if (!b.sleeping && find(b).mn >= SLEEP_T) {
    b.sleeping = true; b.vx = b.vy = b.w = 0;
  }
}

function step() {
  for (const b of bodies) { b.px = b.x; b.py = b.y; b.pa = b.a; }
  if (drag) {
    const t = ptr;
    drag.tx = clamp(t.x, 0.05, WW - 0.05); drag.ty = clamp(t.y, 0.05, WH - 0.05);
    wake(drag.b);
  }
  const h = FIXED / SUB;
  for (let i = 0; i < SUB; i++) substep(h);
  updateSleep(FIXED);
  updateParticles(FIXED);
}

// ============================================================
//  파티클 (충돌 스파크)
// ============================================================
const parts = [];
function impactFX(x, y, nx, ny, speed, a, b) {
  if (parts.length > 260) return;
  const src = a.isStatic ? b : a;
  const cnt = Math.min(7, 1 + (speed * 0.5) | 0);
  for (let i = 0; i < cnt; i++) {
    const ang = Math.atan2(ny, nx) + Math.PI + rnd(-1.1, 1.1);
    const sp = rnd(0.5, 0.25 * speed + 1.5);
    parts.push({ x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp - 0.5, life: 0, max: rnd(0.25, 0.55), hue: src.hue });
  }
}
function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.vy += 6 * dt; p.x += p.vx*dt; p.y += p.vy*dt;
  }
}

// ============================================================
//  입력 (마우스 / 터치 / 펜)
// ============================================================
const ptr = { x: 0, y: 0, down: false, id: null, inside: false };
let hover = null;
const lastPtr = { x: 0, y: 0 };

function toWorld(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / PPM, y: (e.clientY - r.top) / PPM };
}
function hit(b, x, y, slack) {
  const dx = x - b.x, dy = y - b.y;
  if (b.type === 'circle') return dx*dx + dy*dy <= (b.r + slack) ** 2;
  const lx = dx*b.c + dy*b.s, ly = -dx*b.s + dy*b.c;
  return Math.abs(lx) <= b.hw + slack && Math.abs(ly) <= b.hh + slack;
}
function pick(x, y, slack) {
  for (let i = bodies.length - 1; i >= 0; i--) if (hit(bodies[i], x, y, slack)) return bodies[i];
  return null;
}

cv.addEventListener('pointerdown', e => {
  if (ptr.down) return;
  e.preventDefault();
  const p = toWorld(e); ptr.x = p.x; ptr.y = p.y; lastPtr.x = p.x; lastPtr.y = p.y;
  const b = pick(p.x, p.y, e.pointerType === 'touch' ? 0.18 : 0.06);
  if (b) {
    ptr.down = true; ptr.id = e.pointerId;
    cv.setPointerCapture(e.pointerId);
    const dx = p.x - b.x, dy = p.y - b.y;
    drag = { b, lx: dx*b.c + dy*b.s, ly: -dx*b.s + dy*b.c, tx: p.x, ty: p.y, ix: 0, iy: 0 };
    wake(b);
    cv.style.cursor = 'grabbing';
  }
});
cv.addEventListener('pointermove', e => {
  const p = toWorld(e); lastPtr.x = p.x; lastPtr.y = p.y;
  if (ptr.down && e.pointerId === ptr.id) { ptr.x = p.x; ptr.y = p.y; }
  else if (!ptr.down && e.pointerType === 'mouse') {
    hover = pick(p.x, p.y, 0.06);
    cv.style.cursor = hover ? 'grab' : 'default';
  }
});
function release(e) {
  if (!ptr.down || e.pointerId !== ptr.id) return;
  ptr.down = false; ptr.id = null; drag = null; cv.style.cursor = 'default';
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
//  동작 (버튼)
// ============================================================
function wakeAll() { for (const b of bodies) wake(b); }

function explode() {
  const px = lastPtr.x || WW/2, py = lastPtr.y || WH*0.8, R = 7.5;
  for (const b of bodies) {
    const dx = b.x - px, dy = b.y - py, d = Math.hypot(dx, dy);
    if (d >= R) continue;
    const k = 1 - d/R, nx = d > 1e-3 ? dx/d : 0, ny = d > 1e-3 ? dy/d : -1;
    const sp = 20*k + 3;
    b.vx += nx*sp; b.vy += ny*sp - 2*k; b.w += rnd(-6, 6)*k; wake(b);
  }
  for (let i = 0; i < 40; i++) {
    const a = rnd(0, 6.283), s = rnd(2, 10);
    parts.push({ x: px, y: py, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0, max: rnd(.3,.7), hue: rnd(20, 50) });
  }
}
function shake() {
  for (const b of bodies) { b.vx += rnd(-7, 7); b.vy -= rnd(3, 10); b.w += rnd(-5, 5); wake(b); }
}
function clearAll() { bodies.length = 0; sorted.length = 0; parts.length = 0; drag = null; ptr.down = false; }
function resetScene() { clearAll(); spawnRandom(Math.min(28, Math.max(12, (WW*WH/6) | 0))); }

function setPause(v) {
  G.paused = v; const b = document.getElementById('bPause');
  b.textContent = v ? '재생' : '일시정지'; b.classList.toggle('on', v);
}
const actions = {
  circle: () => spawnAt('circle', rnd(1, WW - 1), 0.9),
  box:    () => spawnAt('box', rnd(1, WW - 1), 0.9),
  burst:  () => { for (let i = 0; i < 10; i++) spawnAt(Math.random() < .5 ? 'circle' : 'box', rnd(1, WW - 1), rnd(0.6, 2.2)); },
  explode, shake,
  pause:  () => setPause(!G.paused),
  clear:  clearAll,
  reset:  resetScene,
  obst:   () => { G.obstacles = !G.obstacles; document.getElementById('bObst').classList.toggle('on', G.obstacles); buildStatics(); wakeAll(); buildBg(); },
  debug:  () => { G.debug = !G.debug; document.getElementById('bDebug').classList.toggle('on', G.debug); },
};
document.getElementById('bar').addEventListener('click', e => {
  const t = e.target.closest('button[data-act]'); if (t) actions[t.dataset.act]();
});
function bindSlider(id, out, fmt, key) {
  const el = document.getElementById(id), o = document.getElementById(out);
  const f = () => { G[key] = parseFloat(el.value); o.textContent = fmt(G[key]); if (key === 'g') wakeAll(); };
  el.addEventListener('input', f); f();
}
bindSlider('sG', 'vG', v => v.toFixed(1), 'g');
bindSlider('sB', 'vB', v => Math.round(v*100) + '%', 'bounce');
bindSlider('sF', 'vF', v => Math.round(v*100) + '%', 'fric');
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); actions.pause(); }
  else if (k === 'c') actions.circle();
  else if (k === 'b') actions.box();
  else if (k === 'r') actions.burst();
  else if (k === 'x') actions.explode();
  else if (k === 's') actions.shake();
});

// ============================================================
//  렌더링
// ============================================================
function buildBg() {
  bg = document.createElement('canvas');
  bg.width = W*DPR; bg.height = H*DPR;
  const g = bg.getContext('2d'); g.scale(DPR, DPR);
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#111a33'); gr.addColorStop(1, '#0a0e1a');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // 그리드 (1m 간격)
  g.strokeStyle = 'rgba(140,165,255,.055)'; g.lineWidth = 1; g.beginPath();
  for (let x = 0; x <= WW; x++) { g.moveTo(Math.round(x*PPM) + .5, 0); g.lineTo(Math.round(x*PPM) + .5, WH*PPM); }
  for (let y = 0; y <= WH; y++) { g.moveTo(0, Math.round(y*PPM) + .5); g.lineTo(W, Math.round(y*PPM) + .5); }
  g.stroke();
  // 바닥
  const fy = WH*PPM;
  const fg = g.createLinearGradient(0, fy, 0, H);
  fg.addColorStop(0, '#2a3552'); fg.addColorStop(1, '#151b2e');
  g.fillStyle = fg; g.fillRect(0, fy, W, H - fy);
  g.fillStyle = 'rgba(160,190,255,.35)'; g.fillRect(0, fy, W, 1.5);
}

function resize() {
  const r = stage.getBoundingClientRect();
  W = Math.max(240, Math.floor(r.width)); H = Math.max(240, Math.floor(r.height));
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const target = clamp(Math.hypot(W, H)/22, 34, 80);
  if (!PPM || Math.abs(target/PPM - 1) > 0.3) PPM = target;
  WW = W/PPM; WH = (H - FL)/PPM;
  buildStatics();
  for (const b of bodies) {
    const rad = radiusOf(b);
    b.x = clamp(b.x, rad, Math.max(rad, WW - rad)); b.y = clamp(b.y, rad, Math.max(rad, WH - rad));
    b.px = b.x; b.py = b.y; b.pa = b.a; wake(b);
  }
  buildBg();
}

function drawBody(b, al) {
  const x = (b.px + (b.x - b.px)*al) * PPM, y = (b.py + (b.y - b.py)*al) * PPM, a = b.pa + (b.a - b.pa)*al;
  const held = drag && drag.b === b;
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.lineWidth = 1.5; ctx.strokeStyle = held ? '#fff' : b.cs;
  if (b.type === 'circle') {
    const R = b.r*PPM, g = ctx.createLinearGradient(-R, -R, R, R);
    g.addColorStop(0, b.c1); g.addColorStop(1, b.c2);
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.2832); ctx.fillStyle = g; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, R*0.6, 0, 6.2832); ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(R*0.86, 0); ctx.strokeStyle = 'rgba(0,0,0,.32)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    ctx.beginPath(); ctx.arc(x - R*.32, y - R*.36, R*.22, 0, 6.2832); ctx.fillStyle = 'rgba(255,255,255,.13)'; ctx.fill();
  } else {
    const w = b.hw*PPM, hh = b.hh*PPM, g = ctx.createLinearGradient(-w, -hh, w, hh);
    g.addColorStop(0, b.c1); g.addColorStop(1, b.c2);
    ctx.fillStyle = g; ctx.fillRect(-w, -hh, 2*w, 2*hh); ctx.strokeRect(-w, -hh, 2*w, 2*hh);
    if (w > 9 && hh > 9) { ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 1.2; ctx.strokeRect(-w + 4, -hh + 4, 2*w - 8, 2*hh - 8); }
    ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, 6.2832); ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fill();
    ctx.restore();
  }
  if (G.debug && b.sleeping) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.setLineDash([4, 3]); ctx.strokeStyle = '#7cffb0'; ctx.lineWidth = 1.5;
    if (b.type === 'circle') { ctx.beginPath(); ctx.arc(0, 0, b.r*PPM + 3, 0, 6.2832); ctx.stroke(); }
    else ctx.strokeRect(-b.hw*PPM - 3, -b.hh*PPM - 3, 2*b.hw*PPM + 6, 2*b.hh*PPM + 6);
    ctx.restore();
  }
}

function drawStatic(s) {
  if (s.wall) return;
  ctx.save(); ctx.translate(s.x*PPM, s.y*PPM); ctx.rotate(s.a);
  const g = ctx.createLinearGradient(0, -20, 0, 20); g.addColorStop(0, '#3a4766'); g.addColorStop(1, '#232c44');
  ctx.fillStyle = g; ctx.strokeStyle = 'rgba(170,195,255,.35)'; ctx.lineWidth = 1.5;
  if (s.type === 'circle') { ctx.beginPath(); ctx.arc(0, 0, s.r*PPM, 0, 6.2832); ctx.fill(); ctx.stroke(); }
  else { ctx.fillRect(-s.hw*PPM, -s.hh*PPM, 2*s.hw*PPM, 2*s.hh*PPM); ctx.strokeRect(-s.hw*PPM, -s.hh*PPM, 2*s.hw*PPM, 2*s.hh*PPM); }
  ctx.restore();
}

function draw(al) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(bg, 0, 0, W, H);
  for (const s of statics) drawStatic(s);
  for (const b of bodies) drawBody(b, al);

  // 마우스 스프링
  if (drag) {
    const b = drag.b;
    const bx = (b.px + (b.x - b.px)*al), by = (b.py + (b.y - b.py)*al), ba = b.pa + (b.a - b.pa)*al;
    const c = Math.cos(ba), s = Math.sin(ba);
    const ax = (bx + drag.lx*c - drag.ly*s) * PPM, ay = (by + drag.lx*s + drag.ly*c) * PPM;
    const tx = drag.tx*PPM, ty = drag.ty*PPM;
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ax, ay, 3.5, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(124,156,255,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(tx, ty, 8, 0, 6.2832); ctx.stroke();
  }

  // 스파크
  ctx.lineCap = 'round';
  for (const p of parts) {
    const k = 1 - p.life/p.max;
    ctx.strokeStyle = `hsla(${p.hue},95%,72%,${k})`; ctx.lineWidth = 1 + 2*k;
    ctx.beginPath(); ctx.moveTo(p.x*PPM, p.y*PPM); ctx.lineTo((p.x - p.vx*0.03)*PPM, (p.y - p.vy*0.03)*PPM); ctx.stroke();
  }

  // 디버그: 접촉점 / 법선
  if (G.debug) {
    for (const c of contacts) for (const p of c.pts) {
      const px = p.x*PPM, py = p.y*PPM;
      ctx.strokeStyle = '#ff5c7a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + c.nx*16, py + c.ny*16); ctx.stroke();
      ctx.fillStyle = p.pen > 0 ? '#ffd25c' : '#5cc8ff';
      ctx.beginPath(); ctx.arc(px, py, 3, 0, 6.2832); ctx.fill();
    }
  }
}

// ============================================================
//  메인 루프
// ============================================================
const statsEl = document.getElementById('stats');
let last = performance.now(), acc = 0, fps = 60, statT = 0;

function frame(t) {
  let dt = (t - last) / 1000; last = t;
  if (dt > 0.1) dt = 0.1;
  if (dt > 0) fps += (1/dt - fps) * 0.05;
  if (!G.paused) {
    acc += dt; let n = 0;
    while (acc >= FIXED && n < 3) { step(); acc -= FIXED; n++; }
    if (n === 3) acc = 0;
  }
  draw(G.paused ? 1 : acc / FIXED);
  if ((statT += dt) > 0.25) {
    statT = 0;
    let awake = 0; for (const b of bodies) if (!b.sleeping) awake++;
    statsEl.textContent = `${Math.round(fps)} FPS · 물체 ${bodies.length} · 활성 ${awake} · 접촉 ${contacts.length}`;
  }
  requestAnimationFrame(frame);
}

new ResizeObserver(resize).observe(stage);
resize();
resetScene();
requestAnimationFrame(frame);
window.__sim = { bodies, statics, get contacts() { return contacts; }, G, step };
})();
</script>
